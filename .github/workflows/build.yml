name: Build Mobile Native Agent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Standalone Gradle 8.7
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip -d /opt
        echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

    - name: Accept Android SDK Licenses
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace --no-daemon --no-build-cache
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Mobile-Native-Agent-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
